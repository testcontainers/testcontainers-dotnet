name-template: $RESOLVED_VERSION
tag-template: $RESOLVED_VERSION
template: |
  # What's Changed
  $CHANGES

categories:
  - type: pre-include
    when:
      labels:
        - breaking change
        - enhancement
        - bug
        - documentation
        - chore
        - dependencies

  - title: ⚠️ Breaking Changes
    when:
      label: breaking change

  - title: 🔒 Security
    when:
      label: security

  - title: 🚀 Features
    when:
      label: enhancement

  - title: 🐛 Bug Fixes
    when:
      label: bug

  - title: 📖 Documentation
    when:
      label: documentation

  - title: 🧹 Housekeeping
    when:
      label: chore

  - title: 📦 Dependency Updates
    when:
      label: dependencies
